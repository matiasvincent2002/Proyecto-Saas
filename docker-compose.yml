services:
  backend:
    build: .
    environment:
      PORT: 3000
      SESSION_TTL_HOURS: 8
      DATA_DIRECTORY: /app/data
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - app-data:/app/data
    expose:
      - "3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  app-data:
